name: Deploy Bolt UI to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "project/**"
      - ".github/workflows/frontend-static-web-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Validate frontend
        working-directory: project
        run: |
          npm ci
          npm run typecheck

      - name: Validate production API URL
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "GitHub repository variable VITE_API_BASE_URL is required."
            exit 1
          fi

      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "project"
          api_location: ""
          output_location: "dist"
          app_build_command: "npm run build"
