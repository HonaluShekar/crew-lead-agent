name: Deploy FastAPI backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "api.py"
      - "main.py"
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/backend-app-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate backend
        run: |
          python -m py_compile api.py main.py src/crew_lead/ui_adapter.py
          python -m pytest tests/test_api.py tests/test_ui_api.py tests/test_v1_workflow.py -q

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
